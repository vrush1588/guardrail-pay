<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Guardian – Send Money</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1d4ed8', hover: '#1e40af' },
            ink: '#0f172a', muted: '#64748b', critical: '#e11d48', warning: '#d97706',
            success: '#059669', canvas: '#f8fafc', wash: '#f1f5f9', hairline: '#e2e8f0', keyline: '#cbd5e1',
          },
          fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { -webkit-font-smoothing: antialiased; }</style>
</head>
<body class="bg-canvas min-h-screen flex justify-center font-sans text-ink">
  <div class="w-full max-w-[400px] bg-white min-h-screen px-6 pt-4 pb-6 flex flex-col">

    <header class="flex items-center justify-center gap-2.5 py-2.5 border-b border-hairline">
      <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight">Family Guardian</span>
    </header>

    <!-- View: send form -->
    <section id="view-form" class="mt-6">
      <h1 class="text-[26px] font-bold tracking-tight mb-1">Send money</h1>
      <p class="text-muted mb-5">Sending as <span class="font-semibold text-ink">Grandma Rose</span></p>

      <form id="send-form" class="space-y-4">
        <label class="block">
          <span class="block text-[17px] font-semibold mb-1.5">Who are you paying?</span>
          <input name="recipient_name" required class="w-full h-12 px-3 text-[18px] rounded-lg border border-keyline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
        </label>
        <label class="block">
          <span class="block text-[17px] font-semibold mb-1.5">Amount ($)</span>
          <input name="amount" type="number" min="0.01" step="0.01" required class="w-full h-12 px-3 text-[18px] rounded-lg border border-keyline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
        </label>
        <label class="block">
          <span class="block text-[17px] font-semibold mb-1.5">What is it for?</span>
          <textarea name="note" rows="3" class="w-full px-3 py-2 text-[17px] rounded-lg border border-keyline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"></textarea>
        </label>
        <p id="form-error" class="hidden text-critical font-medium"></p>
        <button type="submit" class="w-full py-4 bg-primary hover:bg-primary-hover text-white font-bold text-[20px] rounded-lg transition-colors disabled:opacity-60">
          Send
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-hairline text-sm text-muted">
        Demo fill:
        <button type="button" data-fill="scam" class="underline hover:text-ink">Mike Turner $800</button> ·
        <button type="button" data-fill="safe" class="underline hover:text-ink">School Cafe $5</button>
      </div>
    </section>

    <!-- View: scam alert (hold / block) -->
    <section id="view-alert" class="hidden mt-4 flex-1 flex flex-col">
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-5" role="alert">
        <div class="flex items-start gap-3.5 mb-4">
          <div class="w-10 h-10 rounded-lg bg-warning text-white flex items-center justify-center flex-shrink-0 mt-0.5">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
          </div>
          <h1 class="text-[23px] leading-tight font-extrabold tracking-tight text-amber-950">Wait. This payment may be a scam.</h1>
        </div>
        <p class="text-[19px] leading-snug font-medium bg-white/70 p-4 rounded-xl border border-amber-200 mb-4">
          You are about to send
          <span id="alert-amount" class="font-extrabold text-amber-950 underline decoration-warning decoration-2 underline-offset-2"></span>
          to <span id="alert-recipient" class="font-bold"></span>.<span id="alert-new"> We have never seen this person before.</span>
        </p>
        <div class="bg-white rounded-xl p-4 border border-amber-200">
          <h2 class="text-[17px] font-bold text-amber-950 mb-2.5 flex items-center">
            <span class="w-2 h-2 rounded-full bg-warning mr-2"></span>Why we are worried
          </h2>
          <ul id="alert-reasons" class="space-y-2 text-[16.5px] leading-snug font-medium text-slate-800 pl-1"></ul>
        </div>
      </div>

      <div class="mt-6 space-y-3">
        <button type="button" id="btn-call" class="w-full py-4 bg-primary hover:bg-primary-hover text-white font-bold text-[20px] rounded-lg transition-colors">
          Call my family
        </button>
        <button type="button" id="btn-send-anyway" class="w-full py-4 bg-white hover:bg-canvas text-ink font-bold text-[18px] rounded-lg border border-hairline hover:border-keyline transition-colors">
          Send anyway (asks family first)
        </button>
        <button type="button" id="btn-cancel" class="w-full py-3.5 text-slate-600 hover:text-ink font-semibold text-[17px] rounded-lg transition-colors">
          Cancel payment
        </button>
        <p class="pt-1 text-sm font-medium text-muted flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4 text-success" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
          </svg>
          <span>Your family has been notified.</span>
        </p>
      </div>
    </section>

    <!-- View: outcome (sent / waiting / cancelled) -->
    <section id="view-result" class="hidden mt-10 text-center">
      <div id="result-icon" class="w-16 h-16 mx-auto rounded-xl flex items-center justify-center text-white text-3xl font-bold"></div>
      <h1 id="result-title" class="mt-5 text-[24px] font-bold tracking-tight"></h1>
      <p id="result-body" class="mt-2 text-[17px] text-slate-700"></p>
      <button type="button" id="btn-new" class="mt-8 w-full py-4 bg-white hover:bg-canvas font-bold text-[18px] rounded-lg border border-hairline hover:border-keyline">
        Send another payment
      </button>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const VIEWS = ['view-form', 'view-alert', 'view-result'];
    let current = null;   // the payment being shown
    let pollTimer = null;

    function show(view) {
      VIEWS.forEach((v) => $(v).classList.toggle('hidden', v !== view));
    }

    const money = (p) => `$${p.amount.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;

    async function api(path, options = {}) {
      const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
      return res.json();
    }

    function showAlert(p) {
      $('alert-amount').textContent = money(p);
      $('alert-recipient').textContent = p.recipient_name;
      $('alert-new').classList.toggle('hidden', !p.recipient_is_new);
      const list = $('alert-reasons');
      list.replaceChildren(...p.risk.signals.map((r) => {
        const li = document.createElement('li');
        li.className = 'flex items-start';
        li.innerHTML = '<span class="text-warning font-bold mr-2.5 text-lg leading-none mt-0.5" aria-hidden="true">•</span><span></span>';
        li.lastChild.textContent = r;
        return li;
      }));
      show('view-alert');
    }

    const RESULTS = {
      approved:  ['bg-success', '✓', 'Payment sent', (p) => `${money(p)} is on its way to ${p.recipient_name}.`],
      waiting:   ['bg-warning', '…', 'Waiting for your family', (p) => `We are holding ${money(p)} for ${p.recipient_name}. Nothing is sent until your family says yes.`],
      cancelled: ['bg-slate-500', '×', 'Payment cancelled', (p) => `No money was sent to ${p.recipient_name}.`],
    };

    function showResult(kind, p) {
      const [bg, icon, title, body] = RESULTS[kind];
      $('result-icon').className = `w-16 h-16 mx-auto rounded-xl flex items-center justify-center text-white text-3xl font-bold ${bg}`;
      $('result-icon').textContent = icon;
      $('result-title').textContent = title;
      $('result-body').textContent = body(p);
      show('view-result');
    }

    // While held, watch for the guardian's decision so the senior screen updates live.
    function watch(p) {
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        const latest = await api(`/api/payments/${p.id}`).catch(() => null);
        if (!latest || latest.status === 'held_for_guardian') return;
        clearInterval(pollTimer);
        current = latest;
        showResult(latest.status === 'approved' ? 'approved' : 'cancelled', latest);
      }, 2000);
    }

    $('send-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const btn = e.target.querySelector('button[type=submit]');
      $('form-error').classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Checking this payment…';
      try {
        current = await api('/api/payments', {
          method: 'POST',
          body: JSON.stringify({
            sender: 'Grandma Rose',
            recipient_name: form.get('recipient_name'),
            amount: Number(form.get('amount')),
            note: form.get('note'),
          }),
        });
        console.log('[senior] payment', current);
        if (current.status === 'approved') {
          showResult('approved', current);
        } else {
          showAlert(current);
          watch(current);
        }
      } catch (err) {
        $('form-error').textContent = `Could not send: ${err.message}`;
        $('form-error').classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send';
      }
    });

    $('btn-call').addEventListener('click', () => {
      console.log('[senior] call-family', current?.id);   // TODO: tel: link / call bridge
    });

    $('btn-send-anyway').addEventListener('click', () => {
      // The payment is already held for the guardian; this just tells the senior so.
      console.log('[senior] send-anyway (asks family)', current?.id);
      showResult('waiting', current);
    });

    $('btn-cancel').addEventListener('click', async () => {
      clearInterval(pollTimer);
      current = await api(`/api/payments/${current.id}/cancel`, { method: 'POST' }).catch((err) => {
        console.warn('[senior] cancel failed', err.message);
        return current;
      });
      showResult('cancelled', current);
    });

    $('btn-new').addEventListener('click', () => {
      clearInterval(pollTimer);
      current = null;
      $('send-form').reset();
      show('view-form');
    });

    const FILLS = {
      scam: { recipient_name: 'Mike Turner', amount: 800, note: 'URGENT - your grandson needs bail money tonight' },
      safe: { recipient_name: 'School Cafe', amount: 5, note: 'Lunch' },
    };
    document.querySelectorAll('[data-fill]').forEach((b) => b.addEventListener('click', () => {
      const form = $('send-form');
      Object.entries(FILLS[b.dataset.fill]).forEach(([k, v]) => { form.elements[k].value = v; });
    }));
  </script>
</body>
</html>
