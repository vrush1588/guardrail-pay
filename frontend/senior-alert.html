<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Guardian – Senior Scam Alert</title>

  <!-- Tailwind Play CDN (design-only, no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Design tokens from DESIGN.md
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1d4ed8', hover: '#1e40af' },
            ink: '#0f172a',          // secondary / deep slate
            muted: '#64748b',        // neutral
            critical: '#e11d48',     // crimson – risk
            warning: '#d97706',      // amber
            success: '#059669',      // emerald
            canvas: '#f8fafc',
            wash: '#f1f5f9',
            hairline: '#e2e8f0',
            keyline: '#cbd5e1',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="bg-canvas min-h-screen flex justify-center font-sans text-ink">

  <!-- Phone-width column -->
  <div class="w-full max-w-[400px] bg-white min-h-screen flex flex-col">

    <!-- Screen -->
    <div class="px-6 pt-4 pb-6 flex-1 flex flex-col">

      <!-- App bar -->
      <header class="flex items-center justify-center gap-2.5 py-2.5 border-b border-hairline">
        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight">Family Guardian</span>
      </header>

      <main class="mt-4">
        <!-- Warning card -->
        <section class="bg-amber-50 border border-amber-200 rounded-xl p-5" role="alert">
          <div class="flex items-start gap-3.5 mb-4">
            <div class="w-10 h-10 rounded-lg bg-warning text-white flex items-center justify-center flex-shrink-0 mt-0.5">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
              </svg>
            </div>
            <h1 class="text-[23px] leading-tight font-extrabold tracking-tight text-amber-950">
              Wait. This payment may be a scam.
            </h1>
          </div>

          <!-- Payment details (mock data) -->
          <p class="text-[19px] leading-snug font-medium bg-white/70 p-4 rounded-xl border border-amber-200 mb-4">
            You are about to send
            <span class="font-extrabold text-amber-950 underline decoration-warning decoration-2 underline-offset-2">$800</span>
            to <span class="font-bold">Mike Turner</span>. We have never seen this person before.
          </p>

          <!-- Reasons -->
          <div class="bg-white rounded-xl p-4 border border-amber-200">
            <h2 class="text-[17px] font-bold text-amber-950 mb-2.5 flex items-center">
              <span class="w-2 h-2 rounded-full bg-warning mr-2"></span>
              Why we are worried
            </h2>
            <ul class="space-y-2 text-[16.5px] leading-snug font-medium text-slate-800 pl-1">
              <li class="flex items-start">
                <span class="text-warning font-bold mr-2.5 text-lg leading-none mt-0.5" aria-hidden="true">•</span>
                <span>The message asks you to hurry.</span>
              </li>
              <li class="flex items-start">
                <span class="text-warning font-bold mr-2.5 text-lg leading-none mt-0.5" aria-hidden="true">•</span>
                <span>Scammers often pretend to be a relative in trouble.</span>
              </li>
            </ul>
          </div>
        </section>
      </main>

      <!-- Actions -->
      <footer class="mt-6 space-y-3">
        <button type="button" data-action="call-family"
          class="w-full py-4 px-4 bg-primary hover:bg-primary-hover text-white font-bold text-[20px] rounded-lg transition-colors flex items-center justify-center gap-2.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.3" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
          </svg>
          <span>Call my family</span>
        </button>

        <button type="button" data-action="send-anyway"
          class="w-full py-4 px-4 bg-white hover:bg-canvas text-ink font-bold text-[18px] leading-tight rounded-lg border border-hairline hover:border-keyline transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary">
          Send anyway (asks family first)
        </button>

        <button type="button" data-action="cancel-payment"
          class="w-full py-3.5 px-4 text-slate-600 hover:text-ink font-semibold text-[17px] rounded-lg transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
          Cancel payment
        </button>

        <p class="pt-1 text-sm font-medium text-muted flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4 text-success flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
          </svg>
          <span>Your family has been notified.</span>
        </p>
      </footer>
    </div>
  </div>

  <script>
    // Placeholder handlers – no API calls yet.
    document.querySelectorAll('[data-action]').forEach((btn) => {
      btn.addEventListener('click', () => {
        console.log('[senior-alert]', btn.dataset.action, { amount: 800, recipient: 'Mike Turner' });
      });
    });
  </script>
</body>
</html>
