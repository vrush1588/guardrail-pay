<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Guardian – Guardian Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1d4ed8', hover: '#1e40af' },
            ink: '#0f172a', muted: '#64748b', critical: '#e11d48', warning: '#d97706',
            success: '#059669', canvas: '#f8fafc', wash: '#f1f5f9', hairline: '#e2e8f0', keyline: '#cbd5e1',
          },
          fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { -webkit-font-smoothing: antialiased; }</style>
</head>
<body class="bg-canvas min-h-screen font-sans text-ink">

  <header class="bg-white border-b border-hairline">
    <div class="max-w-[1280px] mx-auto px-4 sm:px-8 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
        </div>
        <span class="text-lg font-bold tracking-tight whitespace-nowrap">Family Guardian</span>
        <span class="hidden sm:inline ml-2 text-[11px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded bg-wash text-slate-600 border border-hairline">Guardian</span>
      </div>
      <div class="flex items-center gap-3 flex-shrink-0">
        <a href="/senior.html" target="_blank" class="hidden sm:inline text-sm font-medium text-muted hover:text-ink">Open senior screen ↗</a>
        <button id="btn-seed" class="h-10 px-3 sm:px-4 whitespace-nowrap bg-white hover:bg-canvas text-sm font-semibold rounded-lg border border-hairline hover:border-keyline">
          Load demo data
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1280px] mx-auto px-4 sm:px-8 py-6 sm:py-8 space-y-6">

    <!-- Counts: stacked rows on mobile, tiles from sm up -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-6">
      <div class="bg-white border border-hairline rounded-xl px-4 py-3 sm:p-6 flex items-center justify-between sm:block">
        <p class="text-[11px] font-semibold uppercase tracking-wider text-muted">Checked</p>
        <p id="count-checked" class="sm:mt-1 text-2xl sm:text-[32px] font-semibold tracking-tight">0</p>
      </div>
      <div class="bg-white border border-hairline rounded-xl px-4 py-3 sm:p-6 flex items-center justify-between sm:block">
        <p class="text-[11px] font-semibold uppercase tracking-wider text-warning">Held</p>
        <p id="count-held" class="sm:mt-1 text-2xl sm:text-[32px] font-semibold tracking-tight">0</p>
      </div>
      <div class="bg-white border border-hairline rounded-xl px-4 py-3 sm:p-6 flex items-center justify-between sm:block">
        <p class="text-[11px] font-semibold uppercase tracking-wider text-critical">Blocked</p>
        <p id="count-blocked" class="sm:mt-1 text-2xl sm:text-[32px] font-semibold tracking-tight">0</p>
      </div>
    </section>

    <p id="rules" class="text-sm text-muted"></p>
    <p id="error" class="hidden text-sm font-medium text-critical"></p>

    <!-- Needs your decision -->
    <section>
      <h2 class="text-lg font-semibold tracking-tight mb-3">Needs your decision</h2>
      <div id="held-list" class="space-y-4"></div>
      <p id="held-empty" class="bg-white border border-hairline rounded-xl p-4 sm:p-6 text-muted">
        Nothing is waiting for you. Click “Load demo data” or send a payment from the senior screen.
      </p>
    </section>

    <!-- All activity -->
    <!-- From and Time columns hide on mobile; the To cell shows the sender underneath instead -->
    <section class="bg-white border border-hairline rounded-xl overflow-hidden">
      <h2 class="text-lg font-semibold tracking-tight px-4 sm:px-6 pt-5 pb-3">All activity</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left text-[11px] font-semibold uppercase tracking-wider text-muted border-y border-hairline bg-canvas">
            <tr>
              <th class="hidden sm:table-cell px-6 py-2.5">From</th><th class="px-4 sm:px-6 py-2.5">To</th>
              <th class="px-3 sm:px-6 py-2.5 text-right">Amount</th><th class="px-3 sm:px-6 py-2.5">Shield</th>
              <th class="px-4 sm:px-6 py-2.5">Status</th><th class="hidden sm:table-cell px-6 py-2.5">Time</th>
            </tr>
          </thead>
          <tbody id="activity" class="divide-y divide-wash"></tbody>
        </table>
      </div>
    </section>
  </main>

  <template id="held-card">
    <article class="bg-white border border-hairline rounded-xl p-4 sm:p-6 flex flex-col sm:flex-row gap-4 sm:gap-6 sm:items-start">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-1">
          <span data-f="chip" class="text-[11px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded border"></span>
          <span data-f="score" class="text-xs text-muted"></span>
        </div>
        <p class="text-xl sm:text-[22px] font-semibold tracking-tight break-words">
          <span data-f="amount"></span> <span class="text-muted font-normal">to</span> <span data-f="recipient"></span>
        </p>
        <p class="text-sm text-muted mt-0.5"><span data-f="sender"></span> · <span data-f="new"></span> · <span data-f="time"></span></p>
        <p data-f="note" class="mt-3 text-sm italic text-slate-600"></p>
        <p data-f="reason" class="mt-3 text-sm font-medium"></p>
        <ul data-f="signals" class="mt-3 space-y-1 text-sm text-slate-700 list-disc pl-5"></ul>
        <div data-f="script" class="hidden mt-4 rounded-lg border border-hairline bg-canvas p-4 text-sm">
          <p class="text-[11px] font-semibold uppercase tracking-wider text-primary mb-2">Before you decide, call them</p>
          <p data-f="opening" class="italic text-slate-700"></p>
          <ol data-f="questions" class="mt-2 space-y-1 list-decimal pl-5"></ol>
          <p data-f="if-scam" class="mt-3 font-medium"></p>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:flex sm:flex-col gap-2 sm:w-36 flex-shrink-0">
        <button data-act="approve" class="h-11 sm:h-10 bg-primary hover:bg-primary-hover text-white text-sm font-semibold rounded-lg disabled:opacity-60">Approve</button>
        <button data-act="cancel" class="h-11 sm:h-10 bg-white hover:bg-canvas text-sm font-semibold rounded-lg border border-hairline hover:border-keyline disabled:opacity-60">Cancel</button>
        <button data-act="call-script" class="col-span-2 h-11 sm:h-10 px-2 text-sm font-semibold text-primary hover:bg-wash rounded-lg disabled:opacity-60">What should I ask?</button>
      </div>
    </article>
  </template>

  <script>
    const $ = (id) => document.getElementById(id);

    const VERDICT_CHIP = {
      allow: 'bg-emerald-100 text-emerald-700 border-emerald-200',
      hold:  'bg-amber-100 text-amber-700 border-amber-200',
      block: 'bg-rose-100 text-rose-700 border-rose-200',
    };
    const STATUS_LABEL = {
      awaiting_payer: 'At PayPal', pending_review: 'Reviewing', held_for_guardian: 'Held', approved: 'Sent', cancelled: 'Cancelled',
      refunded: 'Refunded',
    };
    const PENDING_LABEL = { approve: 'Sending…', cancel: 'Cancelling…', 'call-script': 'Writing…', refund: 'Refunding…' };
    const pending = new Set();   // "id:action" requests in flight; survives the 3s re-render

    const money = (p) => `$${p.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
    const time = (p) => new Date(p.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

    async function api(path, options = {}) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
      return res.json();
    }

    function chip(el, verdict) {
      el.textContent = verdict;
      el.className = `text-[11px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded border ${VERDICT_CHIP[verdict]}`;
    }

    function renderHeld(payments) {
      const held = payments.filter((p) => p.status === 'held_for_guardian');
      $('held-empty').classList.toggle('hidden', held.length > 0);
      $('held-list').replaceChildren(...held.map((p) => {
        const card = $('held-card').content.cloneNode(true);
        const f = (name) => card.querySelector(`[data-f="${name}"]`);
        chip(f('chip'), p.risk.verdict);
        f('score').textContent = `Shield: ${p.risk.risk_level} risk`;
        f('amount').textContent = money(p);
        f('recipient').textContent = p.recipient_name;
        f('sender').textContent = `From ${p.sender}`;
        f('new').textContent = p.recipient_is_new ? 'New recipient' : 'Known recipient';
        f('time').textContent = time(p);
        f('note').textContent = p.note ? `“${p.note}”` : '';
        f('reason').textContent = p.risk.reason;
        f('signals').replaceChildren(...p.risk.signals.map((r) => {
          const li = document.createElement('li');
          li.textContent = r;
          return li;
        }));
        if (p.call_script) {
          f('script').classList.remove('hidden');
          f('opening').textContent = `“${p.call_script.opening}”`;
          f('questions').replaceChildren(...p.call_script.questions.map((q) => {
            const li = document.createElement('li');
            li.textContent = q;
            return li;
          }));
          f('if-scam').textContent = `If it is a scam: ${p.call_script.if_scam}`;
          card.querySelector('[data-act="call-script"]').remove();
        }
        card.querySelectorAll('[data-act]').forEach((btn) => wireAction(btn, p.id, btn.dataset.act));
        return card;
      }));
    }

    function renderActivity(payments) {
      $('activity').replaceChildren(...payments.map((p) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="hidden sm:table-cell px-6 py-3"></td>
          <td class="px-4 sm:px-6 py-3"><span class="font-medium"></span><span class="sm:hidden block text-xs text-muted"></span></td>
          <td class="px-3 sm:px-6 py-3 text-right tabular-nums"></td><td class="px-3 sm:px-6 py-3"><span></span></td>
          <td class="px-4 sm:px-6 py-3"></td><td class="hidden sm:table-cell px-6 py-3 text-muted"></td>`;
        const td = tr.children;
        td[0].textContent = p.sender;
        td[1].children[0].textContent = p.recipient_name;
        td[1].children[1].textContent = `${p.sender} · ${time(p)}`;
        td[2].textContent = money(p);
        if (p.risk) chip(td[3].firstChild, p.risk.verdict);
        td[4].textContent = STATUS_LABEL[p.status];
        if (p.status === 'approved') {
          // Sent already: the guardian can still pull it back if it turns out to be a scam.
          const btn = document.createElement('button');
          btn.className = 'ml-2 text-xs font-semibold text-critical hover:underline disabled:opacity-60';
          btn.textContent = 'Refund';
          wireAction(btn, p.id, 'refund');
          td[4].append(btn);
        }
        td[5].textContent = time(p);
        return tr;
      }));
    }

    async function refresh() {
      try {
        const payments = await api('/api/payments');
        $('count-checked').textContent = payments.length;
        $('count-held').textContent = payments.filter((p) => p.risk?.verdict === 'hold').length;
        $('count-blocked').textContent = payments.filter((p) => p.risk?.verdict === 'block').length;
        renderHeld(payments);
        renderActivity(payments);
        $('error').classList.add('hidden');
      } catch (err) {
        $('error').textContent = `Could not reach the server: ${err.message}`;
        $('error').classList.remove('hidden');
      }
    }

    function wireAction(btn, id, action) {
      if (pending.has(`${id}:${action}`)) {
        btn.disabled = true;
        btn.textContent = PENDING_LABEL[action];
      }
      btn.addEventListener('click', () => decide(id, action));
    }

    async function decide(id, action) {
      if (action === 'refund' && !confirm('Refund this payment? The money goes back to the sender.')) return;
      const key = `${id}:${action}`;
      pending.add(key);
      refresh();
      let failure = null;
      try {
        console.log(`[guardian] ${action}`, await api(`/api/payments/${id}/${action}`, { method: 'POST' }));
      } catch (err) {
        console.warn(`[guardian] ${action} failed`, err.message);
        failure = err.message;
      }
      pending.delete(key);
      await refresh();
      if (failure) {
        $('error').textContent = failure;
        $('error').classList.remove('hidden');
      }
    }

    $('btn-seed').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = 'Shield is checking…';   // three Gemini calls, ~10s
      try {
        console.log('[guardian] seed', await api('/api/seed', { method: 'POST' }));
      } catch (err) {
        console.warn('[guardian] seed failed', err.message);
      }
      btn.disabled = false;
      btn.textContent = 'Load demo data';
      refresh();
    });

    api('/api/rules').then((r) => {
      const parts = [
        r.paused ? 'ALL PAYMENTS PAUSED' : null,
        `payments over $${r.max_amount} need you`,
        r.allow_new_recipients ? 'new recipients allowed' : 'new recipients need you',
        `${r.cooling_off_minutes}-min cooling-off for new payees`,
        `unanswered holds are cancelled after ${r.hold_expiry_minutes / 60} h`,
        'Rules can only make Shield stricter, never looser.',
      ];
      $('rules').textContent = `Family rules: ${parts.filter(Boolean).join(' · ')}`;
    }).catch(() => {});

    refresh();
    setInterval(refresh, 3000);   // picks up payments the senior sends
  </script>
</body>
</html>
