<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Guardian - Senior Alert View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 md:p-8">

  <!-- Outer Phone Mockup Frame Container -->
  <div class="w-full max-w-[412px] bg-white rounded-[44px] shadow-2xl border-[9px] border-slate-900 overflow-hidden flex flex-col relative">

    <!-- Phone Speaker Notch / Status area -->
    <div class="pt-3 pb-1 px-7 flex items-center justify-between text-slate-800 text-sm font-semibold select-none bg-white">
      <span>9:41</span>
      <!-- Speaker capsule -->
      <div class="w-20 h-4 bg-slate-900 rounded-full flex items-center justify-center">
        <div class="w-3 h-3 rounded-full bg-slate-950/70 mr-1.5"></div>
      </div>
      <div class="flex items-center space-x-1.5 text-slate-700">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.3"/>
          <path d="M12 6c-3.31 0-6 2.69-6 6 0 1.45.52 2.78 1.38 3.82L12 19.1l4.62-3.28C17.48 14.78 18 13.45 18 12c0-3.31-2.69-6-6-6z"/>
        </svg>
        <span class="text-xs font-bold">5G</span>
        <!-- Battery icon -->
        <div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
          <div class="h-full w-full bg-slate-800 rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Screen Content Wrapper -->
    <div class="px-6 pt-3 pb-8 flex-1 flex flex-col justify-between bg-white text-slate-900">

      <div>
        <!-- Top App Bar / Brand Header -->
        <header class="flex items-center justify-center space-x-2.5 py-2.5 border-b border-slate-100">
          <!-- Small shield logo -->
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm flex-shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
            </svg>
          </div>
          <span class="text-xl font-bold tracking-tight text-slate-900">Family Guardian</span>
        </header>

        <!-- Main Content Area -->
        <main class="mt-4 space-y-4">

          <!-- Large Amber Warning Card -->
          <section class="bg-amber-50 border-2 border-amber-300/90 rounded-2xl p-5 shadow-sm">
            <!-- Warning Header with Icon and Headline -->
            <div class="flex items-start space-x-3.5 mb-4">
              <!-- Warning triangle icon -->
              <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
              </div>
              <h1 class="text-[23px] leading-tight font-extrabold text-amber-950 tracking-tight">
                Wait. This payment may be a scam.
              </h1>
            </div>

            <!-- Large readable recipient detail text -->
            <p class="text-[19px] leading-snug font-semibold text-slate-900 mb-4 bg-white/70 p-3.5 rounded-xl border border-amber-200/70">
              You are about to send <span class="font-extrabold text-amber-950 underline decoration-amber-400 decoration-2 underline-offset-2">$800</span> to <span class="font-bold text-slate-950">Mike Turner</span>. We have never seen this person before.
            </p>

            <!-- "Why we are worried" Box -->
            <div class="bg-white rounded-xl p-4 border border-amber-200 shadow-2xs">
              <h2 class="text-[17px] font-bold text-amber-950 mb-2.5 flex items-center">
                <span class="w-2 h-2 rounded-full bg-amber-500 mr-2 inline-block"></span>
                Why we are worried
              </h2>
              <ul class="space-y-2 text-[16.5px] leading-snug text-slate-800 font-medium pl-1">
                <li class="flex items-start">
                  <span class="text-amber-600 font-bold mr-2.5 text-lg leading-none mt-0.5">•</span>
                  <span>The message asks you to hurry.</span>
                </li>
                <li class="flex items-start">
                  <span class="text-amber-600 font-bold mr-2.5 text-lg leading-none mt-0.5">•</span>
                  <span>Scammers often pretend to be a relative in trouble.</span>
                </li>
              </ul>
            </div>
          </section>

        </main>
      </div>

      <!-- Action Buttons Stack and Bottom Status Notice -->
      <footer class="mt-5 space-y-3 pt-2">
        <!-- Button 1: Primary blue -->
        <button type="button" class="w-full py-4 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-[20px] rounded-2xl shadow-md transition-colors flex items-center justify-center space-x-2.5 focus:outline-none focus:ring-4 focus:ring-blue-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
          </svg>
          <span>Call my family</span>
        </button>

        <!-- Button 2: Outlined -->
        <button type="button" class="w-full py-4 px-4 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-800 font-bold text-[18px] leading-tight rounded-2xl border-2 border-slate-300 shadow-xs transition-colors flex items-center justify-center text-center focus:outline-none focus:ring-4 focus:ring-slate-200">
          Send anyway (asks family first)
        </button>

        <!-- Button 3: Gray text button -->
        <button type="button" class="w-full py-3.5 px-4 text-slate-600 hover:text-slate-900 active:text-slate-950 font-semibold text-[17px] rounded-xl transition-colors flex items-center justify-center focus:outline-none">
          Cancel payment
        </button>

        <!-- Bottom line -->
        <div class="pt-1 text-center">
          <p class="text-sm font-medium text-slate-500 flex items-center justify-center space-x-1.5">
            <svg class="w-4 h-4 text-emerald-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
            </svg>
            <span>Your family has been notified.</span>
          </p>
        </div>

        <!-- Phone Home Indicator Bar -->
        <div class="pt-2 flex justify-center">
          <div class="w-32 h-1 bg-slate-300 rounded-full"></div>
        </div>
      </footer>

    </div>
  </div>

</body>
</html>
